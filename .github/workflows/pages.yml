name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/nfl_qbs.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test before publishing
        run: node --test "web/tests/**/*.test.js"

      # An allowlist of what the browser loads. Tests, the parity tool and its
      # fixture, and package.json stay out of the published site.
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp web/index.html web/styles.css _site/
          cp -r web/src web/weights _site/
          cp data/nfl_qbs.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
