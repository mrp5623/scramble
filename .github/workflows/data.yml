name: Refresh dataset

on:
  schedule:
    # Tuesdays 12:00 UTC: after Monday night football, before the week's games begin.
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Keep the previous dataset for comparison
        run: cp data/nfl_qbs.json "$RUNNER_TEMP/previous.json"

      - name: Rebuild from the baseline
        run: node tools/refresh-data.mjs

      - name: Refuse bad data
        run: node tools/verify-data.mjs "$RUNNER_TEMP/previous.json" data/nfl_qbs.json

      - name: Commit if anything changed
        run: |
          if git diff --quiet data/nfl_qbs.json; then
            echo "no change this week"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_qbs.json
          git commit -m "data: weekly refresh from nflverse"
          git push
